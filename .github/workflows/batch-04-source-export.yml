name: Batch 04 source export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'batch-04/discovery-import' || github.ref_name == 'batch-04/discovery-import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
      - name: Export tracked source
        run: git archive --format=tar.gz --output=batch-04-source.tar.gz HEAD
      - name: Capture Git tree SHA
        run: git rev-parse HEAD^{tree} > batch-04-tree-sha.txt
      - name: Upload Git tree SHA
        uses: actions/upload-artifact@v4
        with:
          name: batch-04-tree-sha
          path: batch-04-tree-sha.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: batch-04-source
          path: batch-04-source.tar.gz
          if-no-files-found: error
          retention-days: 3
