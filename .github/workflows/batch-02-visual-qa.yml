name: Batch 02 Visual QA

on:
  push:
    branches:
      - batch-02/discovery-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collect Batch 02 visual assets
        run: |
          mkdir -p visual-qa/svg
          cp public/images/discoveries/2022/{telomere-to-telomere-complete-human-genome,thiomargarita-magnifica-giant-bacterium,meraxes-gigas,dart-dimorphos-orbit-change}.svg visual-qa/svg/
          cp public/images/discoveries/2023/{human-pangenome-reference,nanograv-gravitational-wave-background,kalambo-falls-wooden-structure,dinkinesh-selam-contact-binary}.svg visual-qa/svg/
          cp public/images/discoveries/2024/{oldest-amniote-skin-richards-spur,nitroplast-nitrogen-fixing-organelle,ichthyotitan-severnensis,jades-gs-z14-0}.svg visual-qa/svg/
          cp public/images/discoveries/2025/{juvenile-colossal-squid-filmed,penghu-denisovan-jaw,vulcanidris-cratensis-oldest-ant,thutmose-ii-tomb-identified}.svg visual-qa/svg/
          cp public/images/discoveries/2026/{alphagenome-regulatory-dna-model,little-red-dots-gas-cocoon,four-eyed-cambrian-vertebrates,interstellar-organosulfur-molecule}.svg visual-qa/svg/
          test "$(find visual-qa/svg -name '*.svg' | wc -l)" -eq 20
          grep -L 'viewBox="0 0 1600 1000"' visual-qa/svg/*.svg > visual-qa/invalid-viewbox.txt || true
          grep -L 'EDITORIAL ILLUSTRATION' visual-qa/svg/*.svg > visual-qa/missing-label.txt || true
          test ! -s visual-qa/invalid-viewbox.txt
          test ! -s visual-qa/missing-label.txt
          printf '{"assetCount":20,"viewBox":"1600x1000","status":"ready-for-visual-review"}\n' > visual-qa/report.json

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: batch-02-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 3
