name: Batch 02 Visual QA

on:
  push:
    branches:
      - batch-02/discovery-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture the Vercel preview at desktop and mobile widths
        run: |
          mkdir -p visual-qa/desktop visual-qa/mobile
          echo "visual QA started" > visual-qa/debug.txt

          cat > visual-qa/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const baseUrl = 'https://ocean-dive-git-batch-02-discovery-import-storm-dragons-projects.vercel.app';
          const shareToken = 'ACbsB5t4h9aUdkWHxDVFhbbxI6anz1w2';
          const slugs = [
            'telomere-to-telomere-complete-human-genome',
            'thiomargarita-magnifica-giant-bacterium',
            'meraxes-gigas',
            'dart-dimorphos-orbit-change',
            'human-pangenome-reference',
            'nanograv-gravitational-wave-background',
            'kalambo-falls-wooden-structure',
            'dinkinesh-selam-contact-binary',
            'oldest-amniote-skin-richards-spur',
            'nitroplast-nitrogen-fixing-organelle',
            'ichthyotitan-severnensis',
            'jades-gs-z14-0',
            'juvenile-colossal-squid-filmed',
            'penghu-denisovan-jaw',
            'vulcanidris-cratensis-oldest-ant',
            'thutmose-ii-tomb-identified',
            'alphagenome-regulatory-dna-model',
            'little-red-dots-gas-cocoon',
            'four-eyed-cambrian-vertebrates',
            'interstellar-organosulfur-molecule'
          ];

          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };

          const results = [];
          let browser;

          try {
            browser = await chromium.launch({ headless: true });

            for (const [mode, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
              const page = await context.newPage();

              for (const slug of slugs) {
                try {
                  const url = `${baseUrl}/discoveries/${slug}?_vercel_share=${shareToken}`;
                  const response = await page.goto(url, {
                    waitUntil: 'domcontentloaded',
                    timeout: 60000
                  });
                  await page.waitForTimeout(900);

                  const audit = await page.evaluate(() => {
                    const hero = document.querySelector('article header img');
                    const h1 = document.querySelector('h1');
                    const h1Rect = h1?.getBoundingClientRect();
                    return {
                      title: h1?.textContent?.trim() || null,
                      horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                      heroLoaded: Boolean(hero && hero.complete && hero.naturalWidth > 0),
                      heroSource: hero?.getAttribute('src') || null,
                      h1Visible: Boolean(h1Rect && h1Rect.width > 0 && h1Rect.height > 0),
                      bodyTextLength: document.body.innerText.length,
                      finalUrl: location.href
                    };
                  });

                  await page.screenshot({
                    path: `visual-qa/${mode}/${slug}.png`,
                    fullPage: true,
                    animations: 'disabled'
                  });

                  results.push({
                    mode,
                    slug,
                    status: response?.status() ?? null,
                    ...audit
                  });
                } catch (error) {
                  results.push({ mode, slug, error: String(error) });
                }
              }

              await context.close();
            }
          } catch (error) {
            results.push({ fatalError: String(error) });
          } finally {
            if (browser) await browser.close();
          }

          await fs.writeFile('visual-qa/report.json', JSON.stringify(results, null, 2));

          const failures = results.filter((row) =>
            row.fatalError ||
            row.error ||
            row.status !== 200 ||
            row.horizontalOverflow ||
            !row.heroLoaded ||
            !row.heroSource?.includes('/images/discoveries/') ||
            !row.h1Visible ||
            row.bodyTextLength < 500
          );

          await fs.writeFile('visual-qa/failures.json', JSON.stringify(failures, null, 2));
          console.log(JSON.stringify({ checked: results.length, failures }, null, 2));
          EOF

          node visual-qa/capture.mjs 2>&1 | tee visual-qa/capture.log

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-02-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 3
