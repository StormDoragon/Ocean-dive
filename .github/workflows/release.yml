name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for the release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Beyond Signal ${{ inputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md
