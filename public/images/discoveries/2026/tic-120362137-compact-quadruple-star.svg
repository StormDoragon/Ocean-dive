<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TIC 120362137 compact 3+1 quadruple star system</title><desc id="desc">A 3.28-day eclipsing binary is orbited by a third star every 51.3 days, while a fourth star traces a wider 1,046-day orbit.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#172554"/><stop offset="1" stop-color="#02030a"/></radialGradient><radialGradient id="blue"><stop stop-color="#fff"/><stop offset=".18" stop-color="#bfdbfe"/><stop offset=".65" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient><radialGradient id="gold"><stop stop-color="#fff"/><stop offset=".18" stop-color="#fef3c7"/><stop offset=".65" stop-color="#f59e0b"/><stop offset="1" stop-color="#78350f"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><g fill="#fff" opacity=".65"><circle cx="120" cy="300" r="3"/><circle cx="300" cy="205" r="2"/><circle cx="545" cy="270" r="3"/><circle cx="850" cy="190" r="2"/><circle cx="1080" cy="255" r="4"/><circle cx="1450" cy="180" r="2"/><circle cx="1370" cy="770" r="3"/><circle cx="980" cy="880" r="2"/><circle cx="350" cy="830" r="4"/></g>
  <ellipse cx="810" cy="535" rx="585" ry="350" fill="none" stroke="#818cf8" stroke-width="8" stroke-dasharray="20 17" transform="rotate(-6 810 535)"/>
  <ellipse cx="610" cy="530" rx="365" ry="220" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="16 13" transform="rotate(10 610 530)"/>
  <g transform="translate(525 535)" filter="url(#glow)"><ellipse rx="190" ry="112" fill="none" stroke="#60a5fa" stroke-width="8"/><circle cx="-104" cy="18" r="78" fill="url(#blue)"/><circle cx="98" cy="-15" r="61" fill="url(#gold)"/></g>
  <g filter="url(#glow)"><circle cx="930" cy="420" r="72" fill="url(#gold)"/><circle cx="1295" cy="665" r="84" fill="url(#blue)"/></g>
  <g transform="translate(170 735)"><path d="M0 35h1050" stroke="#64748b" stroke-width="7"/><circle cx="80" cy="35" r="15" fill="#60a5fa"/><circle cx="510" cy="35" r="15" fill="#fbbf24"/><circle cx="955" cy="35" r="15" fill="#818cf8"/><text x="10" y="96" fill="#bfdbfe" font-family="system-ui" font-size="24">3.28-day binary</text><text x="405" y="96" fill="#fde68a" font-family="system-ui" font-size="24">51.3-day third star</text><text x="825" y="96" fill="#ddd6fe" font-family="system-ui" font-size="24">1,046-day fourth star</text></g>
  <text x="70" y="105" fill="#eff6ff" font-family="system-ui" font-size="62" font-weight="750">FOUR STARS, ONE TIGHT DANCE</text><text x="73" y="160" fill="#c7d2fe" font-family="system-ui" font-size="27" letter-spacing="4">TIC 120362137 · COMPACT 3+1 HIERARCHY</text>
  <rect x="70" y="862" width="785" height="72" rx="36" fill="#4f46e5" opacity=".16" stroke="#818cf8" stroke-width="4"/><text x="112" y="910" fill="#e0e7ff" font-family="system-ui" font-size="27" font-weight="700">ONE ECLIPSING BINARY, TWO WIDER COMPANIONS</text>
