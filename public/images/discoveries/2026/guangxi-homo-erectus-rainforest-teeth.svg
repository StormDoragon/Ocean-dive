<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
<title id="title">Dating two fossil deposits</title><desc id="desc">Two horizontal age bars show overlapping estimates for Naxian Cave, 319–241 thousand years ago, and Baxian Cave, 324–184 thousand years ago.</desc>
<defs><radialGradient id="bg" cx=".75" cy=".42" r=".85"><stop stop-color="#20374c"/><stop offset="1" stop-color="#0a1423"/></radialGradient><pattern id="dots" width="31" height="31" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".85" fill="#94c3cd" opacity=".24"/></pattern></defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/>
<g font-family="system-ui, sans-serif"><text x="62" y="65" font-size="20" fill="#80e0be" letter-spacing="3" font-weight="700">HUMAN ORIGINS  /  GUANGXI</text><text x="60" y="137" font-size="52" fill="#ebf6f9" font-weight="700">Dating two fossil deposits</text><text x="62" y="198" font-size="27" fill="#b5c8cf" >Estimated ages in thousands of years before present</text><line x1="196" y1="247" x2="196" y2="487" stroke="#415565" stroke-width="1" /><text x="196" y="520" font-size="23" fill="#b5c8cf" text-anchor="middle">340</text><line x1="412" y1="247" x2="412" y2="487" stroke="#415565" stroke-width="1" /><text x="412" y="520" font-size="23" fill="#b5c8cf" text-anchor="middle">300</text><line x1="628" y1="247" x2="628" y2="487" stroke="#415565" stroke-width="1" /><text x="628" y="520" font-size="23" fill="#b5c8cf" text-anchor="middle">260</text><line x1="844" y1="247" x2="844" y2="487" stroke="#415565" stroke-width="1" /><text x="844" y="520" font-size="23" fill="#b5c8cf" text-anchor="middle">220</text><line x1="1060" y1="247" x2="1060" y2="487" stroke="#415565" stroke-width="1" /><text x="1060" y="520" font-size="23" fill="#b5c8cf" text-anchor="middle">180</text><text x="62" y="345" font-size="27" fill="#ebf6f9" >Naxian</text><line x1="309.4" y1="337" x2="730.6" y2="337" stroke="#7edec4" stroke-width="17" stroke-linecap="round"/><text x="309.4" y="316" font-size="25" fill="#7edec4" text-anchor="middle">319</text><text x="730.6" y="316" font-size="25" fill="#7edec4" text-anchor="middle">241</text><text x="62" y="447" font-size="27" fill="#ebf6f9" >Baxian</text><line x1="282.4" y1="440" x2="1038.4" y2="440" stroke="#efbb75" stroke-width="17" stroke-linecap="round"/><text x="282.4" y="419" font-size="25" fill="#efbb75" text-anchor="middle">324</text><text x="1038.4" y="419" font-size="25" fill="#efbb75" text-anchor="middle">184</text>
<line x1="62" y1="582" x2="1138" y2="582" stroke="#415363" stroke-width="1" /><text x="62" y="628" font-size="19" fill="#b5c8cf" font-weight="700" letter-spacing="3">THE NUCLEON</text><text x="1138" y="628" font-size="17" fill="#b5c8cf" text-anchor="end" letter-spacing="2">EDITORIAL DIAGRAM</text></g></svg>
