  <title id="ridge-title">Seafloor spreading captured at the Southeast Indian Ridge</title>
  <desc id="ridge-desc">Editorial cross-section diagram of the Southeast Indian Ridge showing measured valley subsidence, horizontal extension, and newly mapped lava flows, with the sill-and-dyke explanation clearly presented as an interpretation.</desc>
