<g font-family="system-ui, sans-serif"><text x="62" y="65" font-size="20" fill="#ffd07c" letter-spacing="3" font-weight="700">STELLAR ASTROPHYSICS  /  AT 2016BLU</text><text x="60" y="137" font-size="52" fill="#ebf6f9" font-weight="700">An outburst roughly every 113 days</text><ellipse cx="653" cy="369" rx="315" ry="139" fill="none" stroke="#86bacd" stroke-width="3" stroke-dasharray="8 8"/><circle cx="936" cy="369" r="42" fill="#ffbf71" opacity=".12"/><circle cx="936" cy="369" r="29" fill="#ffd697"/><circle cx="968" cy="369" r="9" fill="#83cfff" stroke="#0b1522" stroke-width="3"/><line x1="936" y1="336" x2="892" y2="268" stroke="#ffd697" stroke-width="2" /><text x="854" y="252" font-size="25" fill="#ffd697" >Erupting star</text><line x1="970" y1="382" x2="1013" y2="445" stroke="#83cfff" stroke-width="2" /><text x="1136" y="478" font-size="25" fill="#83cfff" text-anchor="end">Compact companion</text><text x="65" y="241" font-size="26" fill="#ebf6f9" >Proposed orbit</text><text x="65" y="277" font-size="20" fill="#b5c8cf" >Schematic · not to scale</text><text x="65" y="550" font-size="26" fill="#ebf6f9" >Near closest approach, captured gas could power the X-rays.</text>
