<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="graphene-title graphene-desc">
  <title id="graphene-title">Magnetic fields boost superconductivity in rhombohedral graphene</title>
  <desc id="graphene-desc">Editorial data visualization of rhombohedral graphene layers with superconducting regions that persist or strengthen under an applied magnetic-field arrow, without asserting a resolved microscopic pairing mechanism.</desc>
  <defs>
    <linearGradient id="graphene-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101837"/><stop offset=".55" stop-color="#40245d"/><stop offset="1" stop-color="#092f50"/></linearGradient>
    <linearGradient id="graphene-layer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54d7e5"/><stop offset=".5" stop-color="#b584e1"/><stop offset="1" stop-color="#ffcf73"/></linearGradient>
    <filter id="graphene-glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#graphene-bg)"/>
  <g transform="translate(250 290)">
    <path d="M0 150 L650 15 L890 165 L240 300Z" fill="#183d63" stroke="#9beff3" stroke-width="8"/>
    <path d="M35 245 L685 110 L925 260 L275 395Z" fill="url(#graphene-layer)" opacity=".85"/>
    <path d="M70 340 L720 205 L960 355 L310 490Z" fill="#7551a8" opacity=".82"/>
    <path d="M105 435 L755 300 L995 450 L345 585Z" fill="#e1a667" opacity=".72"/>
    <g fill="#f3fbff" opacity=".85"><circle cx="185" cy="195" r="13"/><circle cx="275" cy="176" r="13"/><circle cx="365" cy="158" r="13"/><circle cx="455" cy="140" r="13"/><circle cx="545" cy="122" r="13"/><circle cx="635" cy="104" r="13"/><circle cx="725" cy="86" r="13"/><circle cx="286" cy="292" r="13"/><circle cx="376" cy="274" r="13"/><circle cx="466" cy="256" r="13"/><circle cx="556" cy="238" r="13"/><circle cx="646" cy="220" r="13"/></g>
  </g>
  <g fill="none" stroke="#f5c568" stroke-width="18" stroke-linecap="round">
    <path d="M180 195 V70"/><path d="M140 110 L180 70 L220 110"/>
    <path d="M1420 800 V675"/><path d="M1380 715 L1420 675 L1460 715"/>
  </g>
  <path d="M600 750 C730 650 820 865 955 748 C1080 640 1190 825 1320 720" fill="none" stroke="#72f0df" stroke-width="28" stroke-linecap="round"/>
  <path d="M600 750 C730 650 820 865 955 748 C1080 640 1190 825 1320 720" fill="none" stroke="#bbfaff" stroke-width="8" stroke-linecap="round"/>
  <g fill="#72f0df" opacity=".45" filter="url(#graphene-glow)"><circle cx="720" cy="700" r="40"/><circle cx="955" cy="748" r="40"/><circle cx="1190" cy="750" r="40"/></g>
</svg>
