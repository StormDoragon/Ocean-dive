<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Evidence for a Eurasian ice sheet 2.4 million years ago</title><desc id="desc">A pale ice sheet spreads across a map of northern Eurasia while a marine sediment core preserves layers of ice-rafted debris.</desc>
