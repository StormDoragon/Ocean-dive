<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Evidence for a Eurasian ice sheet 2.4 million years ago</title><desc id="desc">A pale ice sheet spreads across northern Eurasia toward the Netherlands beside Hattem Bed Complex glacial gravels dated with paired aluminum-26 and beryllium-10 burial clocks.</desc>
