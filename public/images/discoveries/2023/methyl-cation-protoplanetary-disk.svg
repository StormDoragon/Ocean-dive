    <radialGradient id="methyl-bg" cx=".58" cy=".45"><stop stop-color="#713c88"/><stop offset=".4" stop-color="#261a58"/><stop offset="1" stop-color="#08152e"/></radialGradient>
    <radialGradient id="methyl-star"><stop stop-color="#fff9d3"/><stop offset=".45" stop-color="#ffcf73"/><stop offset="1" stop-color="#ee7659"/></radialGradient>
    <filter id="methyl-glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#methyl-bg)"/>
  <ellipse cx="800" cy="520" rx="525" ry="170" fill="#a35fca" opacity=".23" transform="rotate(-12 800 520)"/>
  <ellipse cx="800" cy="520" rx="420" ry="122" fill="none" stroke="#e3a3e8" stroke-width="38" opacity=".4" transform="rotate(-12 800 520)"/>
  <ellipse cx="800" cy="520" rx="295" ry="82" fill="none" stroke="#72d5ec" stroke-width="22" opacity=".48" transform="rotate(-12 800 520)"/>
  <circle cx="800" cy="520" r="118" fill="#ffba73" opacity=".42" filter="url(#methyl-glow)"/>
  <circle cx="800" cy="520" r="74" fill="url(#methyl-star)"/>
