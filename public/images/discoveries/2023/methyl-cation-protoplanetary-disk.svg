<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="methyl-title methyl-desc">
  <title id="methyl-title">JWST detects the methyl cation in a protoplanetary disk</title>
  <desc id="methyl-desc">Editorial artist impression of a young star and its protoplanetary disk, with a highlighted methyl-cation symbol shown as a schematic spectral detection rather than a photographed molecule.</desc>
