  <text x="70" y="105" fill="#f7fee7" font-family="system-ui" font-size="62" font-weight="750">A CROCODILE WITHOUT A FATHER</text><text x="73" y="160" fill="#d9f99d" font-family="system-ui" font-size="27" letter-spacing="4">FIRST GENETICALLY CONFIRMED CASE IN CROCODYLIA</text>
  <text x="1000" y="560" fill="#713f12" font-family="system-ui" font-size="28">terminal-fusion automixis</text><text x="1234" y="940" fill="#fde68a" font-family="system-ui" font-size="25">maternal DNA only</text>
