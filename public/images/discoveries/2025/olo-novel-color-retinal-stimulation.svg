<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Olo produced by selective retinal stimulation</title><desc id="desc">A stylized eye receives precisely targeted green laser points, opening a luminous color field outside the ordinary display gamut.</desc>
