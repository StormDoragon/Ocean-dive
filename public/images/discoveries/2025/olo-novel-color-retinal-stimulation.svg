  <g filter="url(#glow)" fill="#6dffb0"><circle cx="434" cy="468" r="9"/><circle cx="474" cy="430" r="8"/><circle cx="528" cy="420" r="9"/><circle cx="580" cy="438" r="8"/><circle cx="615" cy="482" r="9"/><circle cx="624" cy="538" r="8"/><circle cx="596" cy="588" r="9"/><circle cx="547" cy="621" r="8"/><circle cx="488" cy="618" r="9"/><circle cx="445" cy="583" r="8"/><circle cx="421" cy="529" r="9"/></g>
  <g transform="translate(900 280)"><rect width="530" height="430" rx="36" fill="#071a1e" stroke="#5eead4" stroke-width="6"/><rect x="45" y="48" width="440" height="235" rx="24" fill="url(#olo)" filter="url(#glow)"/><path d="M74 350h388" stroke="#64748b" stroke-width="9"/><g font-family="system-ui" font-size="22" fill="#ccfbf1"><text x="48" y="395">ordinary display gamut</text><text x="329" y="395" fill="#6dffb0">OLO</text></g><path d="M350 338v-35" stroke="#6dffb0" stroke-width="8"/></g>
  <path d="M805 510 700 518" stroke="#6dffb0" stroke-width="12" filter="url(#glow)"/><path d="m695 518 35-24v48z" fill="#6dffb0"/>
  <text x="70" y="105" fill="#ecfeff" font-family="system-ui" font-size="62" font-weight="750">A COLOR NO SCREEN CAN SHOW</text><text x="73" y="160" fill="#99f6e4" font-family="system-ui" font-size="27" letter-spacing="4">OLO · CELL-BY-CELL RETINAL STIMULATION</text>
