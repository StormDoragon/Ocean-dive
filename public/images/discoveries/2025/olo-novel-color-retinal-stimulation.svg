  <rect width="1600" height="1000" fill="url(#bg)"/><g opacity=".22" stroke="#5eead4" stroke-width="2"><path d="M0 250h1600M0 500h1600M0 750h1600"/><path d="M320 0v1000M640 0v1000M960 0v1000M1280 0v1000"/></g>
  <path d="M150 545c180-250 480-342 735-65-255 300-555 287-735 65z" fill="#e2e8f0" opacity=".94"/><ellipse cx="520" cy="535" rx="235" ry="222" fill="url(#iris)"/><circle cx="520" cy="535" r="103" fill="#020617"/><circle cx="455" cy="455" r="34" fill="#fff" opacity=".8"/>
