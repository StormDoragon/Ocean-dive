  <g transform="translate(505 555)"><circle r="245" fill="url(#planet)"/><path d="M-216-75c140 30 290 30 430 0M-236 15c150 40 315 40 470 0M-195 105c130 28 260 28 390 0" fill="none" stroke="#fff7ed" stroke-width="25" opacity=".44"/><path d="M70-230a245 245 0 0 1 0 460" fill="#020617" opacity=".24"/></g>
