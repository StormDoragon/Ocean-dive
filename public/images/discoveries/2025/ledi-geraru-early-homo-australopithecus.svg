  <title id="ledi-title">Early Homo and an unnamed Australopithecus at Ledi-Geraru</title>
  <desc id="ledi-desc">Editorial reconstruction of two distinct but unnamed hominin tooth groups in a dated Ledi-Geraru landscape, emphasizing coexistence rather than a direct ancestor-descendant line.</desc>
