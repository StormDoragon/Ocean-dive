  <title id="coast-title">Glacier retreat exposed thousands of kilometres of new Arctic coastline</title>
  <desc id="coast-desc">Editorial satellite-map-style visualization of a retreating marine-terminating glacier revealing a newly exposed coastline, with no claim that the simplified outline represents one named glacier.</desc>
