    <path d="M415 667c45-69 139-68 186 0l-17 31H430z"/>
    <path d="M480 645l-18-81 46 63 50-66-22 89z"/>
  </g>
  <g fill="none" stroke="url(#air)" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M445 420C630 300 720 550 884 414"/><path d="M410 520C610 430 705 650 882 520"/><path d="M520 675C680 605 735 720 900 650"/>
  </g>
