<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Airborne environmental DNA biodiversity monitoring</title>
  <desc id="desc">Air passes from animal silhouettes through a sampling filter and becomes colored DNA sequence fragments.</desc>
