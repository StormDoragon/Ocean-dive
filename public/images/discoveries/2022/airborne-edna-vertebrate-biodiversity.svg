    <linearGradient id="air" x1="0" x2="1"><stop stop-color="#6ee7f9" stop-opacity="0"/><stop offset=".55" stop-color="#6ee7f9"/><stop offset="1" stop-color="#c4f1ff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="220" cy="210" r="145" fill="#0f6b67" opacity=".28"/><circle cx="1320" cy="780" r="220" fill="#155e75" opacity=".23"/>
