<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="wasp-title wasp-desc">
  <title id="wasp-title">Webb detects carbon dioxide in WASP-39 b’s atmosphere</title>
  <desc id="wasp-desc">Editorial diagram of starlight passing through the atmosphere of the transiting gas giant WASP-39 b, with a spectral absorption band representing carbon dioxide.</desc>
  <defs>
    <linearGradient id="wasp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071b35"/>
      <stop offset="1" stop-color="#211143"/>
    </linearGradient>
    <radialGradient id="wasp-star">
      <stop stop-color="#fff5c4"/>
      <stop offset=".55" stop-color="#ffca6b"/>
      <stop offset="1" stop-color="#ef7c43"/>
    </radialGradient>
    <linearGradient id="wasp-planet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9fe4ed"/>
      <stop offset=".55" stop-color="#347aa9"/>
      <stop offset="1" stop-color="#15294e"/>
    </linearGradient>
    <filter id="wasp-glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wasp-bg)"/>
  <g fill="#d6efff" opacity=".55">
    <circle cx="150" cy="130" r="3"/><circle cx="300" cy="280" r="2"/><circle cx="560" cy="110" r="4"/>
    <circle cx="710" cy="260" r="2"/><circle cx="1050" cy="150" r="3"/><circle cx="1370" cy="220" r="2"/>
    <circle cx="1460" cy="750" r="4"/><circle cx="1110" cy="880" r="2"/><circle cx="440" cy="810" r="3"/>
  </g>
  <circle cx="325" cy="500" r="205" fill="#ffbd61" opacity=".28" filter="url(#wasp-glow)"/>
  <circle cx="325" cy="500" r="155" fill="url(#wasp-star)"/>
  <path d="M480 435 C720 400 920 400 1210 435 L1210 565 C920 600 720 600 480 565Z" fill="#d9f7ff" opacity=".13"/>
  <path d="M480 458 C730 430 940 430 1210 458" fill="none" stroke="#b8f1ff" stroke-width="10" opacity=".82"/>
  <path d="M480 530 C730 560 940 560 1210 530" fill="none" stroke="#b8f1ff" stroke-width="10" opacity=".82"/>
  <circle cx="900" cy="500" r="155" fill="#42a4c5" opacity=".32" filter="url(#wasp-glow)"/>
  <circle cx="900" cy="500" r="126" fill="url(#wasp-planet)" stroke="#caf4fa" stroke-width="8"/>
  <path d="M790 475 C850 430 945 430 1015 478" fill="none" stroke="#f4c56b" stroke-width="20" opacity=".58"/>
  <path d="M785 535 C855 580 960 580 1015 530" fill="none" stroke="#153a68" stroke-width="22" opacity=".65"/>
  <g transform="translate(1125 690)">
    <rect x="-70" y="-135" width="360" height="220" rx="22" fill="#0a2344" stroke="#5fc6e7" stroke-width="4"/>
    <path d="M-35 18 C20 18 36 4 74 4 C112 4 126 18 168 18 C205 18 220 -80 258 -80" fill="none" stroke="#84eff3" stroke-width="12" stroke-linecap="round"/>
    <path d="M-35 48 C20 48 55 48 100 48 C145 48 180 48 255 48" fill="none" stroke="#f1d1ff" stroke-width="5" opacity=".7"/>
    <circle cx="220" cy="-80" r="12" fill="#ffd276"/>
  </g>
</svg>
