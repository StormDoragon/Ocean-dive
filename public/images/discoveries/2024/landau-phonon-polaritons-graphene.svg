<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="landau-title landau-desc">
  <title id="landau-title">Landau–phonon polaritons imaged in graphene heterostructures</title>
  <desc id="landau-desc">Editorial data visualization of infrared wavefronts in a graphene and boron-nitride heterostructure, with magnetic-field-tunable hybrid modes represented by avoided crossings.</desc>
  <defs>
    <linearGradient id="landau-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071833"/><stop offset="1" stop-color="#3c1758"/></linearGradient>
    <linearGradient id="landau-layer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3bd0e4"/><stop offset=".5" stop-color="#f3c578"/><stop offset="1" stop-color="#d87cd6"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#landau-bg)"/>
  <g transform="translate(160 150)">
    <path d="M0 470 L1000 280 L1200 420 L200 610Z" fill="#123b5b" stroke="#8ee9ef" stroke-width="7"/>
    <path d="M80 540 L1080 350 L1200 420 L200 610Z" fill="url(#landau-layer)" opacity=".78"/>
    <path d="M30 640 L1030 450 L1150 520 L150 710Z" fill="#6051a4" opacity=".8"/>
    <g fill="none" stroke="#d8faff" stroke-width="14" opacity=".85">
      <path d="M145 500 C300 370 455 612 600 475 S900 385 1060 425"/>
      <path d="M170 578 C335 448 480 685 625 550 S930 460 1090 500"/>
      <path d="M205 655 C360 525 510 755 660 625 S955 535 1120 575"/>
    </g>
  </g>
