    <path d="M42 285 C110 248 155 205 205 142 C250 86 287 55 320 35" fill="none" stroke="#f2c674" stroke-width="15"/>
    <path d="M42 35 C102 92 150 135 202 192 C248 240 283 266 320 285" fill="none" stroke="#cc80df" stroke-width="15"/>
    <path d="M42 285 C135 235 174 195 210 164 C248 130 281 80 320 35" fill="none" stroke="#8ae7ef" stroke-width="9"/>
    <path d="M42 35 C140 85 178 127 214 160 C248 194 290 244 320 285" fill="none" stroke="#8ae7ef" stroke-width="9"/>
    <circle cx="210" cy="163" r="13" fill="#effcff"/>
  </g>
  <g stroke="#f2d370" stroke-width="12" stroke-linecap="round"><path d="M110 245 V85"/><path d="M60 135 L110 85 L160 135"/></g>
</svg>
