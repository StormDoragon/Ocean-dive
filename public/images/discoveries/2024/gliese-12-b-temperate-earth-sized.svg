<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gliese 12 b transiting a nearby red dwarf</title><desc id="desc">An Earth-sized planet crosses a quiet red dwarf along a twelve-day orbit.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#251c3d"/><stop offset="1" stop-color="#050713"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff7ed"/><stop offset=".16" stop-color="#fca5a5"/><stop offset=".55" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1d1d"/></radialGradient><radialGradient id="planet" cx=".35" cy=".3"><stop stop-color="#bae6fd"/><stop offset=".45" stop-color="#0ea5e9"/><stop offset="1" stop-color="#082f49"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="25"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><g fill="#fff" opacity=".7"><circle cx="130" cy="290" r="3"/><circle cx="355" cy="200" r="2"/><circle cx="710" cy="130" r="3"/><circle cx="1040" cy="210" r="2"/><circle cx="1370" cy="160" r="4"/><circle cx="1470" cy="430" r="2"/><circle cx="1180" cy="820" r="3"/><circle cx="740" cy="875" r="2"/><circle cx="290" cy="795" r="4"/></g>
  <circle cx="1050" cy="520" r="350" fill="#ef4444" opacity=".14" filter="url(#glow)"/><circle cx="1050" cy="520" r="245" fill="url(#sun)"/><g fill="none" stroke="#fecaca" opacity=".35"><path d="M890 430c100-65 210-45 320 34M875 535c120-45 240-22 350 60M910 650c82-38 170-35 265-3" stroke-width="13"/></g>
  <ellipse cx="812" cy="525" rx="510" ry="240" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-dasharray="17 17" transform="rotate(-11 812 525)"/>
  <g transform="translate(435 445)"><circle r="105" fill="url(#planet)"/><path d="M-72-20c45-34 88-28 130 12M-45 52c40-28 72-26 105-2" fill="none" stroke="#99f6e4" stroke-width="22" opacity=".55"/><path d="M25-98a105 105 0 0 1 0 196" fill="#071525" opacity=".46"/></g>
  <g transform="translate(150 690)"><path d="M0 120h480M0 120c80 0 100-1 145-2 50-2 58-83 108-83s57 81 108 83c44 1 60 2 119 2" fill="none" stroke="#67e8f9" stroke-width="9"/><path d="M253 30v190" stroke="#67e8f9" stroke-width="3" stroke-dasharray="10 10"/><text x="158" y="260" fill="#a5f3fc" font-family="system-ui" font-size="24">1.1 ppt transit</text></g>
