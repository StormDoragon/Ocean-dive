  <text x="70" y="105" fill="#ecfeff" font-family="system-ui" font-size="62" font-weight="750">DARK OXYGEN?</text><text x="73" y="160" fill="#a5f3fc" font-family="system-ui" font-size="27" letter-spacing="4">ABYSSAL O₂ ANOMALY · MECHANISM UNCONFIRMED</text>
  <rect x="70" y="835" width="535" height="70" rx="35" fill="#f59e0b" opacity=".18" stroke="#fbbf24" stroke-width="4"/><text x="103" y="882" fill="#fde68a" font-family="system-ui" font-size="28" font-weight="700">PRELIMINARY · EDITOR'S NOTE ACTIVE</text>
