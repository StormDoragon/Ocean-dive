<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Preliminary dark oxygen evidence at abyssal nodules</title><desc id="desc">Oxygen readings rise in a dark seafloor chamber above polymetallic nodules beside a large uncertainty symbol.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#07243a"/><stop offset="1" stop-color="#020710"/></linearGradient><radialGradient id="nodule"><stop stop-color="#94a3b8"/><stop offset=".4" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 735c280-62 520 32 820-14 290-44 520 34 780-17v296H0z" fill="#111827"/>
  <g transform="translate(180 350)"><path d="M0 370V70C0 25 40 0 85 0h440c45 0 85 25 85 70v300" fill="#0e7490" opacity=".12" stroke="#67e8f9" stroke-width="12"/><path d="M80 0v-90m450 90v-90" stroke="#94a3b8" stroke-width="18"/><g fill="url(#nodule)" stroke="#94a3b8" stroke-width="5"><circle cx="95" cy="390" r="66"/><circle cx="210" cy="375" r="83"/><circle cx="343" cy="400" r="71"/><circle cx="470" cy="374" r="91"/><circle cx="580" cy="408" r="61"/></g><g fill="#a5f3fc" filter="url(#glow)"><circle cx="178" cy="288" r="12"/><circle cx="270" cy="260" r="9"/><circle cx="388" cy="308" r="13"/><circle cx="480" cy="227" r="10"/><circle cx="310" cy="190" r="8"/><circle cx="420" cy="130" r="10"/></g></g>
  <g transform="translate(900 300)"><path d="M0 430h430M50 430V0" stroke="#64748b" stroke-width="7"/><path d="M53 385c90 0 125-45 180-102s105-115 180-244" fill="none" stroke="#67e8f9" stroke-width="14"/><g fill="#cffafe"><circle cx="53" cy="385" r="12"/><circle cx="150" cy="350" r="12"/><circle cx="233" cy="283" r="12"/><circle cx="315" cy="180" r="12"/><circle cx="413" cy="39" r="12"/></g><text x="88" y="485" fill="#a5f3fc" font-family="system-ui" font-size="25">hours in darkness</text><text x="-10" y="-20" fill="#a5f3fc" font-family="system-ui" font-size="25">O₂</text></g>
